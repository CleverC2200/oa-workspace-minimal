version = 1
name = "oa-workspace-dev"

[setup]
script = "python3 -B -m scripts.dev_environment preflight"

[[actions]]
name = "只读预检"
icon = "tool"
command = "python3 -B -m scripts.dev_environment preflight"

[[actions]]
name = "准备开发依赖"
icon = "tool"
command = "python3 -B -m scripts.dev_environment prepare"

[[actions]]
name = "静态检查"
icon = "tool"
command = ".venv/bin/python -B -m scripts.dev_environment verify --check lint --check schema"

[[actions]]
name = "聚焦环境回归"
icon = "tool"
command = ".venv/bin/python -B -m scripts.dev_environment verify --tests tests/finance_preaudit/test_dev_environment.py"

[[actions]]
name = "完整离线验收"
icon = "tool"
command = ".venv/bin/python -B -m scripts.dev_environment verify --full"
