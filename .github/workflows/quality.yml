name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Native local environment contract
        run: python -m scripts.quality environment
      - name: Production review configuration contract
        run: python -m scripts.quality production-config
      - name: Skill validation
        run: python -m scripts.quality skill
      - name: Payment relationship rule ownership
        run: python -m scripts.quality payment-rules
      - name: Text format
        run: python -m scripts.quality format
      - name: Sensitive files and secrets
        run: python -m scripts.quality hygiene
      - name: Markdown links
        run: python -m scripts.quality links
      - name: YAML and issue forms
        run: python -m scripts.quality yaml
      - name: Generated review schemas
        run: python -m scripts.quality schema
      - name: Python critical lint
        run: python -m scripts.quality lint
      - name: PR contract
        if: github.event_name == 'pull_request'
        run: python -m scripts.quality pr --event "$GITHUB_EVENT_PATH"
      - name: Python syntax
        run: python -m compileall -q apps scripts tests
      - name: Offline unit and golden replay tests
        run: python -m pytest -v -x --tb=short

  macos-stop-recovery:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Stop recovery tests with no skips
        run: |
          python -m pytest -q --tb=short --junitxml="$RUNNER_TEMP/stop-recovery.xml" tests/finance_preaudit/test_manual_stop_recovery.py
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(os.environ['RUNNER_TEMP']) / 'stop-recovery.xml'
          cases = ElementTree.parse(report).findall('.//testcase')
          skipped = [case.get('name') for case in cases if case.find('skipped') is not None]
          if not cases or skipped:
              raise SystemExit(f'stop_recovery_tests_incomplete: skipped={skipped}')
          print(f'Stop recovery: {len(cases)} tests, no skips')
          PY
