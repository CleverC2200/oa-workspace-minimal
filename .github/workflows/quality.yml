name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Skill validation
        run: python -m scripts.quality skill
      - name: Text format
        run: python -m scripts.quality format
      - name: Sensitive files and secrets
        run: python -m scripts.quality hygiene
      - name: Markdown links
        run: python -m scripts.quality links
      - name: PR contract
        if: github.event_name == 'pull_request'
        run: python -m scripts.quality pr --event "$GITHUB_EVENT_PATH"
      - name: Python syntax
        run: python -m compileall -q apps scripts tests
      - name: Offline unit and golden replay tests
        run: python -m pytest -v
